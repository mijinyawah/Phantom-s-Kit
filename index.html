<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom's Kit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2313161f'/%3E%3Cpath d='M32 10l6.5 13.5L52 28l-10 9.8L44.5 52 32 45l-12.5 7L22 37.8 12 28l13.5-4.5z' fill='%23f5b942'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0d0f18;
      --surface: #13161f;
      --surface2: #1c1f2e;
      --surface3: #22263a;
      --border: #252a3d;
      --text: #e2e5f0;
      --muted: #6b7394;
      --gold: #f5b942;
      --gold-bg: rgba(245, 185, 66, 0.1);
      --green: #34d399;
      --orange: #fb923c;
      --red: #f87171;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --warlock: #9b5de5;
      --titan: #3a86ff;
      --void: #7c3aed;
      --solar: #f97316;
      --arc: #38bdf8;
      --strand: #4ade80;
      --stasis: #93c5fd;
      --kinetic: #94a3b8;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(58, 134, 255, 0.18), transparent 26%),
        linear-gradient(180deg, #0d0f18 0%, #111420 48%, #0a0d15 100%);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: none;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none !important;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(13, 15, 24, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.24), rgba(124, 58, 237, 0.22));
      border: 1px solid rgba(245, 185, 66, 0.28);
      color: var(--gold);
      font-size: 20px;
    }

    .brand-copy h1 {
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .brand-copy p {
      color: var(--muted);
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tabs,
    .activity-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab,
    .activity-tab,
    .ghost-btn,
    .primary-btn,
    .danger-btn,
    .toggle-btn {
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      transition: 160ms ease;
    }

    .tab,
    .activity-tab,
    .ghost-btn,
    .toggle-btn {
      background: rgba(255, 255, 255, 0.02);
    }

    .tab.active {
      background: rgba(155, 93, 229, 0.16);
      border-color: rgba(155, 93, 229, 0.42);
      color: #fff;
    }

    .tab.active[data-char="titan"] {
      background: rgba(58, 134, 255, 0.16);
      border-color: rgba(58, 134, 255, 0.42);
    }

    .activity-tab.active {
      background: rgba(245, 185, 66, 0.12);
      border-color: rgba(245, 185, 66, 0.35);
      color: #fff;
    }

    .tab:hover,
    .activity-tab:hover,
    .ghost-btn:hover,
    .primary-btn:hover,
    .danger-btn:hover,
    .toggle-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .power-chip {
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .power-chip strong {
      color: var(--gold);
      font-size: 13px;
    }

    .primary-btn {
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.85), rgba(251, 146, 60, 0.92));
      color: #111;
      font-weight: 700;
      border-color: rgba(245, 185, 66, 0.52);
    }

    .danger-btn {
      background: rgba(248, 113, 113, 0.08);
      color: #ffd0d0;
      border-color: rgba(248, 113, 113, 0.3);
    }

    .ghost-btn {
      color: var(--text);
    }

    .sync-banner,
    .global-status,
    .activity-bar,
    .card,
    .empty-state {
      background: linear-gradient(180deg, rgba(19, 22, 31, 0.94), rgba(15, 18, 28, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .activity-bar {
      padding: 12px;
      margin-bottom: 16px;
    }

    .global-status {
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .global-status-copy {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(96, 165, 250, 0.2);
      border-top-color: var(--blue);
      animation: spin 0.9s linear infinite;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .sync-banner {
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .sync-banner strong {
      color: var(--green);
    }

    .card {
      padding: 26px;
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 180px;
      background: linear-gradient(120deg, rgba(124, 58, 237, 0.15), rgba(58, 134, 255, 0.08), transparent 65%);
      pointer-events: none;
    }

    .card > * {
      position: relative;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .build-title {
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.05;
      margin-bottom: 14px;
      max-width: 760px;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill,
    .chip,
    .badge,
    .mw-badge,
    .mini-stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pill {
      background: rgba(255, 255, 255, 0.04);
    }

    .pill.exotic {
      color: var(--gold);
      background: var(--gold-bg);
      border-color: rgba(245, 185, 66, 0.28);
    }

    .pill.warn {
      color: #ffd5b8;
      background: rgba(251, 146, 60, 0.12);
      border-color: rgba(251, 146, 60, 0.28);
    }

    .pill.note {
      color: #d7e7ff;
      background: rgba(96, 165, 250, 0.12);
      border-color: rgba(96, 165, 250, 0.28);
    }

    .concept {
      max-width: 780px;
      color: #c7cbdb;
      margin-bottom: 24px;
      font-size: 15px;
    }

    .gear-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 18px;
    }

    .panel h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .item-list {
      display: grid;
      gap: 10px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 86px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .item-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .item-slot {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding-top: 2px;
    }

    .item-name {
      font-weight: 600;
    }

    .item-name.exotic {
      color: var(--gold);
    }

    .item-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .badge {
      font-size: 12px;
      padding: 6px 10px;
      align-self: center;
      white-space: nowrap;
    }

    .loc-char {
      background: rgba(52, 211, 153, 0.12);
      color: #bef8df;
      border-color: rgba(52, 211, 153, 0.2);
    }

    .loc-vault {
      background: rgba(167, 139, 250, 0.12);
      color: #e0d7ff;
      border-color: rgba(167, 139, 250, 0.22);
    }

    .loc-titan {
      background: rgba(251, 146, 60, 0.12);
      color: #ffd9be;
      border-color: rgba(251, 146, 60, 0.22);
    }

    .loc-warlock,
    .loc-hunter {
      background: rgba(96, 165, 250, 0.12);
      color: #d8e9ff;
      border-color: rgba(96, 165, 250, 0.24);
    }

    .mods-wrap {
      margin-bottom: 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      color: #d9dded;
    }

    .mods-note {
      color: var(--muted);
    }

    .toggle-btn {
      width: 100%;
      text-align: left;
      font-weight: 600;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .toggle-btn span {
      color: var(--muted);
      font-weight: 500;
      margin-left: 6px;
    }

    .details {
      display: none;
      gap: 16px;
    }

    .details.open {
      display: grid;
    }

    .stats-grid,
    .detail-grid,
    .live-grid {
      display: grid;
      gap: 16px;
    }

    .stats-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .detail-grid,
    .live-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-card,
    .detail-card,
    .inventory-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 18px;
    }

    .stat-label,
    .section-kicker {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .stat-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
    }

    .stat-note,
    .detail-note,
    .artifact-tip,
    .subtle-copy,
    .helper-text {
      color: var(--muted);
    }

    .detail-list {
      display: grid;
      gap: 12px;
    }

    .detail-entry {
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .detail-entry:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .detail-head,
    .inventory-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .detail-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-weight: 600;
    }

    .mini-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .mini-stat {
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    .mw-badge {
      padding: 5px 9px;
      font-size: 12px;
    }

    .mw-low {
      background: rgba(248, 113, 113, 0.12);
      color: #ffd7d7;
      border-color: rgba(248, 113, 113, 0.18);
    }

    .mw-mid {
      background: rgba(251, 146, 60, 0.12);
      color: #ffe0c9;
      border-color: rgba(251, 146, 60, 0.2);
    }

    .mw-high {
      background: rgba(52, 211, 153, 0.12);
      color: #c7f6df;
      border-color: rgba(52, 211, 153, 0.18);
    }

    .element-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 12px currentColor;
    }

    .artifact-list {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .artifact-row {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 12px;
      align-items: start;
    }

    .artifact-col {
      color: var(--gold);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding-top: 1px;
    }

    .inventory-list {
      display: grid;
      gap: 10px;
    }

    .inventory-entry {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .inventory-entry:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .slot-group {
      margin-bottom: 12px;
    }

    .slot-group:last-child {
      margin-bottom: 0;
    }

    .slot-group h5 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .empty-state {
      padding: 28px;
      color: var(--muted);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 14, 0.56);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 18;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(380px, 100vw);
      height: 100vh;
      background: linear-gradient(180deg, #10131c, #0c0f17);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      transform: translateX(102%);
      transition: transform 220ms ease;
      z-index: 20;
      overflow-y: auto;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-inner {
      padding: 24px 20px 36px;
      display: grid;
      gap: 18px;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-head h2 {
      font-size: 22px;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
    }

    .settings-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .settings-card h3 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: #cfd5e8;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .status-good {
      color: var(--green);
    }

    .status-bad {
      color: #ffbbbb;
    }

    .status-progress {
      color: var(--blue);
    }

    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .muted-link {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .gear-grid,
      .detail-grid,
      .live-grid,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-right {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 600px) {
      .shell {
        width: min(100% - 20px, 100%);
        padding-top: 10px;
      }

      .card,
      .sync-banner,
      .activity-bar {
        border-radius: 18px;
      }

      .card {
        padding: 20px;
      }

      .item-row {
        grid-template-columns: 1fr;
      }

      .artifact-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="settingsDrawer" aria-hidden="true">
    <div class="drawer-inner">
      <div class="drawer-head">
        <div>
          <h2>Settings</h2>
          <p class="helper-text">Bungie auth, sync, and local data.</p>
        </div>
        <button class="close-btn" id="closeDrawerBtn" aria-label="Close settings">✕</button>
      </div>
      <div id="settingsContent"></div>
    </div>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-copy">
          <h1>Phantom's Kit</h1>
          <p>Destiny 2 build optimizer and vault-aware loadout planner</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="tabs" id="charTabs"></div>
        <div class="power-chip" id="powerChip"></div>
        <button class="ghost-btn" id="settingsToggleBtn">Settings</button>
      </div>
    </header>

    <section class="activity-bar">
      <div class="activity-tabs" id="activityTabs"></div>
    </section>

    <section class="global-status hidden" id="globalStatus"></section>

    <section class="sync-banner hidden" id="syncBanner"></section>

    <section id="buildMount"></section>
  </main>

  <script>
    const TOKEN_URL = "https://www.bungie.net/Platform/App/OAuth/token/";
    const AUTHORIZE_URL = "https://www.bungie.net/en/OAuth/Authorize";
    const PROFILE_COMPONENTS = "100,102,200,201,202";
    const QUICK_PROFILE_COMPONENTS = "100,200,202";
    const SLOT_NAMES = {
      1498876634: "Kinetic",
      2465295065: "Energy",
      953998645: "Heavy",
      3448274439: "Helmet",
      3551918588: "Arms",
      14239492: "Chest",
      20886954: "Legs",
      1585787867: "Class",
    };
    const CLASS_MAP = { 0: "Titan", 1: "Hunter", 2: "Warlock" };
    const CLASS_TYPE_BY_KEY = { titan: 0, hunter: 1, warlock: 2 };
    const EL_COLORS = {
      void: "#7c3aed",
      solar: "#f97316",
      arc: "#38bdf8",
      strand: "#4ade80",
      stasis: "#93c5fd",
      kinetic: "#94a3b8",
    };
    const LOC_LABELS = {
      char: "Equipped",
      vault: "Vault",
      titan: "On Titan",
      warlock: "On Warlock",
      hunter: "On Hunter",
    };

    const BUILDS = {
      warlock: {
        casual: {
          name: "Void Devour Battlemage",
          subclass: "🌀 Void",
          exotic: "Karnstein Armlets",
          concept: "Two healing loops at once. Devour heals on every kill; Karnstein Armlets stack bonus healing on top. In strikes you're near-unkillable as long as kills keep coming. Every Void kill refreshes grenade, melee, and rift.",
          armor: [

    };

    const S = {
      apiKey: localStorage.getItem("d2_apiKey") || "",
      clientId: localStorage.getItem("d2_clientId") || "",
      accessToken: localStorage.getItem("d2_accessToken") || "",
      tokenExpiry: parseInt(localStorage.getItem("d2_tokenExpiry") || "0", 10),
      char: localStorage.getItem("d2_char") || "warlock",
      activity: localStorage.getItem("d2_activity") || "casual",
      showDetails: localStorage.getItem("d2_showDetails") === "true",
      liveInventory: readJson("d2_liveInventory"),
      itemMeta: readJson("d2_itemMeta") || {},
      lastSync: localStorage.getItem("d2_lastSync") || "",
      drawerOpen: false,
      syncStatus: "",
      syncError: "",
      syncing: false,
    };

    function readJson(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function ls(key, value) {
      S[key] = value;
      if (typeof value === "object" && value !== null) {
        localStorage.setItem("d2_" + key, JSON.stringify(value));
      } else {
        localStorage.setItem("d2_" + key, String(value));
      }
    }

    function removeStored(key) {
      localStorage.removeItem("d2_" + key);
      if (key in S) {
        S[key] = key === "liveInventory" ? null : "";
      }
    }

    function isTokenValid() {
      return Boolean(S.accessToken && S.tokenExpiry && Date.now() < S.tokenExpiry);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function formatDateTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function formatCountdown(ms) {
      if (ms <= 0) return "expired";
      const totalMinutes = Math.ceil(ms / 60000);
      if (totalMinutes < 60) return totalMinutes + " min";
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours + " hr" + (minutes ? " " + minutes + " min" : "");
    }

    function getStatTone(value) {
      if (value >= 100) return { klass: "status-good", color: "var(--green)" };
      if (value >= 70) return { klass: "", color: "var(--blue)" };
      if (value >= 50) return { klass: "", color: "var(--orange)" };
      return { klass: "status-bad", color: "var(--red)" };
    }

    function getMwTone(mw) {
      if (mw >= 8) return "mw-high";
      if (mw >= 4) return "mw-mid";
      return "mw-low";
    }

    function locationClass(loc) {
      return "loc-" + (loc || "vault");
    }

    function locationLabel(loc) {
      return LOC_LABELS[loc] || loc || "Stored";
    }

    function renderCharTabs() {
      document.getElementById("charTabs").innerHTML = Object.entries(CHARS).map(([key, info]) => `
        <button class="tab ${S.char === key ? "active" : ""}" data-char="${key}" type="button">
          ${escapeHtml(info.label)}
        </button>
      `).join("");
    }

    function renderPowerChip() {
      const info = CHARS[S.char];
      document.getElementById("powerChip").innerHTML = `${escapeHtml(info.label)} Power <strong>${info.power}</strong>`;
    }

    function renderActivityTabs() {
      const activities = CHARS[S.char].activities;
      if (!activities.includes(S.activity)) {
        S.activity = activities[0];
        localStorage.setItem("d2_activity", S.activity);
      }
      document.getElementById("activityTabs").innerHTML = activities.map((activity) => `
        <button class="activity-tab ${S.activity === activity ? "active" : ""}" data-activity="${activity}" type="button">
          ${escapeHtml(ACT_LABEL[activity])}
        </button>
      `).join("");
    }

      const banner = document.getElementById("syncBanner");
      if (!S.liveInventory || !S.lastSync) {
        banner.classList.add("hidden");
        banner.innerHTML = "";

      banner.classList.remove("hidden");
      banner.innerHTML = `

      return items.reduce((acc, item) => {

        if (!acc[key]) acc[key] = [];
        acc[key].push(item);
        return acc;
      }, {});
    }

    function getLiveCharacterRecord(charKey) {
      if (!S.liveInventory || !S.liveInventory.byChar) return null;
      return Object.values(S.liveInventory.byChar).find((entry) => entry.className && entry.className.toLowerCase() === charKey) || null;
    }

    function getRecommendations(char, liveInventory) {
      const myClassType = CLASS_TYPE_BY_KEY[char];
      const armorSlots = ["Helmet", "Arms", "Chest", "Legs", "Class"];
      const allArmor = [
        ...Object.values(liveInventory.byChar).flatMap((c) => [...c.equipped, ...c.inventory]),
        ...liveInventory.vault,
      ].filter((item) => armorSlots.includes(item.slot) && (item.classType === myClassType || item.classType === 3));

      const myChar = Object.values(liveInventory.byChar).find((c) => c.className.toLowerCase() === char);
      const equipped = myChar ? myChar.equipped.filter((item) => armorSlots.includes(item.slot)) : [];
      const exoticOptions = allArmor.filter((item) => item.isExotic && !equipped.some((eq) => eq.name === item.name));
      const seen = new Set();
      const uniqueExotics = exoticOptions.filter((item) => {
        const key = item.slot + "|" + item.name;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      return { exoticOptions: uniqueExotics, equipped };
    }

    function getLegendaryUpgrades(char, liveInventory) {
      const myClassType = CLASS_TYPE_BY_KEY[char];
      const armorSlots = ["Helmet", "Arms", "Chest", "Legs", "Class"];
      const myChar = Object.values(liveInventory.byChar).find((c) => c.className.toLowerCase() === char);
      if (!myChar) return [];
      const equippedSlots = new Set(myChar.equipped.filter((item) => armorSlots.includes(item.slot)).map((item) => item.slot));
      const allArmor = [
        ...Object.values(liveInventory.byChar).flatMap((c) => [...c.equipped, ...c.inventory]),
        ...liveInventory.vault,
      ].filter((item) => armorSlots.includes(item.slot) && !item.isExotic && item.isLegendary && equippedSlots.has(item.slot) && (item.classType === myClassType || item.classType === 3));

      const deduped = [];
      const seen = new Set();
      for (const item of allArmor) {
        const key = item.slot + "|" + item.name + "|" + item.loc;
        if (seen.has(key)) continue;
        seen.add(key);
        deduped.push(item);
      }
      return deduped;
    }

    function generateVerifier() {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
    }

    async function generateChallenge(verifier) {
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
    }

    function getRedirectUri() {
      return window.location.origin + window.location.pathname;
    }

    function generateState() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (value) => value.toString(16).padStart(2, "0")).join("");
    }

    async function startLogin() {
      if (!S.clientId) throw new Error("Add your OAuth client_id first.");
      const verifier = generateVerifier();
      const challenge = await generateChallenge(verifier);
      const state = generateState();
      const redirectUri = getRedirectUri();
      localStorage.setItem("pkce_verifier", verifier);
      localStorage.setItem("pkce_state", state);
      const params = new URLSearchParams({
        client_id: S.clientId,
        response_type: "code",
        redirect_uri: redirectUri,
        state,
        code_challenge: challenge,
        code_challenge_method: "S256",
      });
      window.location.href = AUTHORIZE_URL + "?" + params.toString();
    }

    async function handleOAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      const state = params.get("state");
      if (error) {
        throw new Error(params.get("error_description") || error);
      }
      if (!code) return false;

      const verifier = localStorage.getItem("pkce_verifier");
      const expectedState = localStorage.getItem("pkce_state");
      if (!verifier) throw new Error("No PKCE verifier found — restart login.");
      if (!state || !expectedState || state !== expectedState) {
        throw new Error("OAuth state mismatch — restart login.");
      }

      const response = await fetch(TOKEN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          code,
          client_id: S.clientId,
          redirect_uri: getRedirectUri(),
          code_verifier: verifier,
        }),
      });

      const data = await response.json();
      if (!data.access_token) {
        throw new Error(data.error_description || data.error || "Token exchange failed.");
      }

      ls("accessToken", data.access_token);
      ls("tokenExpiry", Date.now() + (data.expires_in * 1000));
      localStorage.removeItem("pkce_verifier");
      localStorage.removeItem("pkce_state");
      window.history.replaceState({}, document.title, window.location.pathname);
      return true;
    }

    async function bApi(path) {
      const headers = { "X-API-Key": S.apiKey };
      if (S.accessToken) headers.Authorization = "Bearer " + S.accessToken;
      const response = await fetch("https://www.bungie.net/Platform" + path, { headers });
      const json = await response.json();
      if (json.ErrorCode && json.ErrorCode !== 1) {
        throw new Error(json.Message || ("Bungie error " + json.ErrorCode));
      }
      return json;
    }

    function setSyncStatus(message, isError) {
      S.syncStatus = isError ? "" : message;
      S.syncError = isError ? message : "";
      renderGlobalStatus();
      renderSyncBanner();
      renderSettingsPanel();
    }

    function normalizeItem(def, loc) {
      return {
        name: def && def.name || "Unknown Item",
        type: def && def.type || "",
        slot: def && def.slot || "Other",
        isExotic: Boolean(def && def.isExotic),
        isLegendary: Boolean(def && def.isLegendary),
        classType: def && Number.isInteger(def.classType) ? def.classType : 3,
        loc,
      };
    }

    function pickMembership(response) {
      const memberships = response.destinyMemberships || [];
      if (!memberships.length) {
        throw new Error("No Destiny memberships were returned for this account.");
      }

      const primaryId = response.primaryMembershipId;
      return memberships.find((item) => String(item.membershipId) === String(primaryId))
        || memberships.find((item) => item.crossSaveOverride && item.crossSaveOverride !== 0)
        || memberships[0];
    }

    async function fetchDefinition(hash, cache) {
      if (cache.has(hash)) return cache.get(hash);
      const json = await bApi("/Destiny2/Manifest/DestinyInventoryItemDefinition/" + hash + "/");
      const def = json.Response || {};
      const normalized = {
        name: def.displayProperties && def.displayProperties.name || "Unknown Item",
        type: def.itemTypeDisplayName || "",
        slot: SLOT_NAMES[def.equippingBlock && def.equippingBlock.equipmentSlotTypeHash] || "Other",
        isExotic: def.inventory && def.inventory.tierType === 6,
        isLegendary: def.inventory && def.inventory.tierType === 5,
        classType: Number.isInteger(def.classType) ? def.classType : 3,
      };
      cache.set(hash, normalized);
      return normalized;
    }

    async function resolveDefinitions(hashes, defs) {
      const unknownHashes = hashes.filter((hash) => !defs.has(hash));
      if (!unknownHashes.length) return;

      const concurrency = 12;
      let resolved = 0;
      for (let i = 0; i < unknownHashes.length; i += concurrency) {
        const batch = unknownHashes.slice(i, i + concurrency);
        await Promise.all(batch.map(async (hash) => {
          await fetchDefinition(hash, defs);
          resolved += 1;
          setSyncStatus(`Resolving new items… ${resolved}/${unknownHashes.length}`, false);
        }));
      }
    }

    function cloneLiveInventoryForMerge() {
      if (!S.liveInventory) {
        return { byChar: {}, vault: [] };
      }
      return {
        byChar: Object.fromEntries(
          Object.entries(S.liveInventory.byChar || {}).map(([charId, entry]) => [charId, {
            className: entry.className,
            equipped: [...(entry.equipped || [])],
            inventory: [...(entry.inventory || [])],
          }])
        ),
        vault: [...(S.liveInventory.vault || [])],
      };
    }

    async function doSync(mode = "full") {
      if (!S.apiKey) throw new Error("Add your Bungie API key first.");
      if (!S.clientId) throw new Error("Add your Bungie OAuth client_id first.");
      if (!isTokenValid()) throw new Error("Session expired — please log in again.");
      if (S.syncing) return;

      S.syncing = true;
      setSyncStatus(mode === "quick" ? "Looking up account for quick refresh…" : "Looking up account…", false);

      try {
        const membershipsJson = await bApi("/User/GetMembershipsForCurrentUser/");
        const membership = pickMembership(membershipsJson.Response);

        setSyncStatus(mode === "quick" ? "Fetching equipped gear…" : "Fetching profile…", false);
        const componentList = mode === "quick" ? QUICK_PROFILE_COMPONENTS : PROFILE_COMPONENTS;
        const profileJson = await bApi(`/Destiny2/${membership.membershipType}/Profile/${membership.membershipId}/?components=${componentList}`);
        const response = profileJson.Response || {};
        const characterDefs = response.characters && response.characters.data || {};
        const characterEquipment = response.characterEquipment && response.characterEquipment.data || {};
        const characterInventories = mode === "full"
          ? (response.characterInventories && response.characterInventories.data || {})
          : {};
        const vaultItems = mode === "full"
          ? (response.profileInventory && response.profileInventory.data && response.profileInventory.data.items || [])
          : [];

        const hashSet = new Set();

        for (const item of vaultItems) {
          hashSet.add(item.itemHash);
        }

        for (const [charId, charDef] of Object.entries(characterDefs)) {
          const className = CLASS_MAP[charDef.classType] || "Unknown";
          const classKey = className.toLowerCase();
          const inventoryItems = mode === "full"
            ? (characterInventories[charId] && characterInventories[charId].items || [])
            : [];
          const equippedItems = characterEquipment[charId] && characterEquipment[charId].items || [];
          for (const item of [...inventoryItems, ...equippedItems]) {
            hashSet.add(item.itemHash);
          }
        }

        const hashes = Array.from(hashSet);
        const defs = new Map(
          Object.entries(S.itemMeta || {}).map(([hash, meta]) => [Number(hash), meta])
        );
        await resolveDefinitions(hashes, defs);

        const liveInventory = mode === "quick"
          ? cloneLiveInventoryForMerge()
          : {
              byChar: {},
              vault: vaultItems.map((item) => normalizeItem(defs.get(item.itemHash), "vault")).filter((item) => item.slot !== "Other"),
            };

        for (const [charId, charDef] of Object.entries(characterDefs)) {
          const className = CLASS_MAP[charDef.classType] || "Unknown";
          const classKey = className.toLowerCase();
          const inventoryItems = mode === "full"
            ? (characterInventories[charId] && characterInventories[charId].items || [])
            : [];
          const equippedItems = characterEquipment[charId] && characterEquipment[charId].items || [];

          liveInventory.byChar[charId] = {
            className,
            equipped: equippedItems.map((item) => normalizeItem(defs.get(item.itemHash), classKey)).filter((item) => item.slot !== "Other"),
            inventory: mode === "quick"
              ? ((liveInventory.byChar[charId] && liveInventory.byChar[charId].inventory) || [])
              : inventoryItems.map((item) => normalizeItem(defs.get(item.itemHash), classKey)).filter((item) => item.slot !== "Other"),
          };
        }

        ls("liveInventory", liveInventory);
        ls("itemMeta", Object.fromEntries(defs.entries()));
        ls("lastSync", new Date().toISOString());
        setSyncStatus(mode === "quick" ? "Quick refresh complete." : "Sync complete.", false);
        renderAll();
      } catch (error) {
        setSyncStatus(error.message || "Sync failed.", true);
        throw error;
      } finally {
        S.syncing = false;
        renderSettingsPanel();
      }
    }

    function logout() {
      removeStored("accessToken");
      removeStored("tokenExpiry");
      S.syncStatus = "";
      S.syncError = "";
      renderAll();
    }

    function clearAllData() {
      ["d2_liveInventory", "d2_itemMeta", "d2_lastSync", "d2_accessToken", "d2_tokenExpiry"].forEach((key) => localStorage.removeItem(key));
      S.liveInventory = null;
      S.itemMeta = {};
      S.lastSync = "";
      S.accessToken = "";
      S.tokenExpiry = 0;
      S.syncStatus = "";
      S.syncError = "";
      renderAll();
    }

    function saveSettingsFromInputs() {
      const apiKeyInput = document.getElementById("apiKeyInput");
      const clientIdInput = document.getElementById("clientIdInput");
      if (!apiKeyInput || !clientIdInput) return;
      ls("apiKey", apiKeyInput.value.trim());
      ls("clientId", clientIdInput.value.trim());
      S.syncStatus = "Settings saved locally.";
      S.syncError = "";
      renderSettingsPanel();
    }

    function attachEvents() {
      document.getElementById("charTabs").addEventListener("click", (event) => {
        const button = event.target.closest("[data-char]");
        if (!button) return;
        const nextChar = button.getAttribute("data-char");
        if (nextChar === S.char) return;
        S.char = nextChar;
        localStorage.setItem("d2_char", S.char);
        const activities = CHARS[S.char].activities;
        if (!activities.includes(S.activity)) {
          S.activity = activities[0];
          localStorage.setItem("d2_activity", S.activity);
        }
        renderAll();
      });

      document.getElementById("activityTabs").addEventListener("click", (event) => {
        const button = event.target.closest("[data-activity]");
        if (!button) return;
        S.activity = button.getAttribute("data-activity");
        localStorage.setItem("d2_activity", S.activity);
        renderAll();
      });

      document.getElementById("settingsToggleBtn").addEventListener("click", openDrawer);
      document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
      document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);

      document.body.addEventListener("click", async (event) => {
        const { id } = event.target;
        try {
          if (id === "detailsToggleBtn") {
            S.showDetails = !S.showDetails;
            localStorage.setItem("d2_showDetails", String(S.showDetails));
            renderBuildCard();
          } else if (id === "saveSettingsBtn") {
            saveSettingsFromInputs();
          } else if (id === "loginBtn" || id === "reloginBtn") {
            saveSettingsFromInputs();
            await startLogin();
          } else if (id === "syncBtn" || id === "bannerSyncBtn") {
            await doSync("full");
          } else if (id === "quickSyncBtn" || id === "bannerQuickSyncBtn") {
            await doSync("quick");
          } else if (id === "logoutBtn") {
            logout();
          } else if (id === "clearDataBtn") {
            clearAllData();
          } else if (id === "globalDismissErrorBtn") {
            S.syncError = "";
            renderAll();
          }
        } catch (error) {
          setSyncStatus(error.message || "Something went wrong.", true);
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && S.drawerOpen) closeDrawer();
      });
    }

    function renderAll() {
      renderCharTabs();
      renderPowerChip();
      renderActivityTabs();
      renderGlobalStatus();
      renderSyncBanner();
      renderBuildCard();
      renderSettingsPanel();
    }

    async function init() {
      attachEvents();
      try {
        const wasCallback = await handleOAuthCallback();
        if (wasCallback) {
          await doSync();
        }
      } catch (error) {
        setSyncStatus(error.message || "OAuth failed.", true);
      }
      renderAll();
      window.setInterval(() => {
        if (S.drawerOpen && isTokenValid()) renderSettingsPanel();
      }, 60000);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
